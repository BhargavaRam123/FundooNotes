<!-- Show "No results found" message when searching and no results -->
<div
  *ngIf="currentSearchQuery && filteredArchiveNotes.length === 0"
  class="no-results"
>
  <div class="no-results-content">
    <mat-icon class="no-results-icon">search_off</mat-icon>
    <p class="no-results-text">
      No archived notes found for "{{ currentSearchQuery }}"
    </p>
    <p class="no-results-subtext">Try searching for something else</p>
  </div>
</div>

<div
  [class.container]="viewType === 'grid'"
  [class.list]="viewType === 'list'"
  *ngIf="filteredArchiveNotes.length > 0"
>
  <app-notes-card
    *ngFor="let note of filteredArchiveNotes"
    [title]="note.title"
    [description]="note.description"
    [viewType]="viewType"
    [color]="note.color"
    [isArchived]="note.isArchived"
    [_id]="note.id"
    [isDeleted]="note.isDeleted"
  ></app-notes-card>
</div>
