<mat-toolbar class="navbar">
  <button
    mat-icon-button
    class="example-icon"
    aria-label="Example icon-button with menu icon"
    (click)="showFiller = !showFiller"
  >
    <mat-icon class="menuicon material-symbols-outlined">menu</mat-icon>
  </button>
  <img *ngIf="!getPageTitle()" src="../../../assets/keepicon.png" alt="" />
  <span
    *ngIf="!getPageTitle()"
    style="color: #5f6368; font-family: sans-serif; font-size: 22px"
    >Keep</span
  >
  <span style="color: #5f6368; font-family: sans-serif; font-size: 22px">{{
    getPageTitle()
  }}</span>
  <span class="example-spacer"></span>
  <div class="searchcontainer">
    <mat-icon class="search-icon menuicon material-symbols-outlined"
      >search</mat-icon
    >
    <input
      type="text"
      class="inpcontainer"
      placeholder="Search"
      [(ngModel)]="searchQuery"
      (input)="onSearchChange($event)"
    />
    <button
      *ngIf="searchQuery"
      mat-icon-button
      class="clear-search-btn"
      (click)="clearSearch()"
    >
      <mat-icon class="material-symbols-outlined">close</mat-icon>
    </button>
  </div>
  <span class="example-spacer"></span>
  <button
    mat-icon-button
    class="example-icon favorite-icon material-symbols-outlined"
    aria-label="Example icon-button with heart icon"
    (mouseover)="refreshHoverChange(true)"
    (mouseleave)="refreshHoverChange(false)"
  >
    <mat-icon
      class="menuicon material-symbols-outlined"
      [class.hover]="refreshHover"
      >refresh</mat-icon
    >
  </button>
  <button
    mat-icon-button
    class="example-icon favorite-icon material-symbols-outlined"
    aria-label="Example icon-button with heart icon"
    (click)="toggleviewType()"
    (mouseover)="viewHoverChange(true)"
    (mouseleave)="viewHoverChange(false)"
  >
    <mat-icon
      class="menuicon material-symbols-outlined weightIncrease dis"
      [fontIcon]="viewType === 'grid' ? 'view_agenda' : 'grid_view'"
      [class.hover]="viewHover"
    ></mat-icon>
  </button>
  <button
    mat-icon-button
    class="example-icon favorite-icon material-symbols-outlined"
    aria-label="Example icon-button with heart icon"
    (mouseover)="settingsHoverChange(true)"
    (mouseleave)="settingsHoverChange(false)"
  >
    <mat-icon
      class="menuicon material-symbols-outlined"
      [class.hover]="settingsHover"
      >settings</mat-icon
    >
  </button>

  <button
    mat-icon-button
    class="example-icon material-icons-outlined"
    aria-label="Example icon-button with share icon"
  >
    <mat-icon class="material-symbols-outlined">apps</mat-icon>
  </button>

  <div class="avatarcontainer">
    <img
      src="https://api.dicebear.com/9.x/notionists-neutral/svg"
      alt=""
      class="avatar"
      [matMenuTriggerFor]="menu"
    />
    <!-- <button matButton >Menu</button> -->
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onLogout()">
        <mat-icon class="material-symbols-outlined" style="margin-right: 0px"
          >logout</mat-icon
        >Logout
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
<app-sidebar
  [showFiller]="showFiller"
  [viewType]="viewType"
  (itemSelected)="onItemSelected($event)"
  (fillerStateChanged)="onFillerStateChanged($event)"
  >></app-sidebar
>
